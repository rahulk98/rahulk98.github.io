<!doctype html>
<html lang="en" data-design="minimal">
<head>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "417e4ef4c2944b32a559316091f0f786"}'></script>

    <!-- Umami Analytics (self-hosted) -->
    <script async src="/assets/js/analytics.js"></script>
    <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project - Rahul Krishnan</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <script>
      (function () {
          try {
              var saved = localStorage.getItem('theme');
              var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              var theme = saved || (prefersDark ? 'dark' : 'light');
              var root = document.documentElement;
              root.classList.remove('light', 'dark');
              root.classList.add(theme === 'light' ? 'light' : 'dark');
          } catch (e) {}
      })();
  </script>
  <script>
      // Canonical URL preserves the project slug so each project page is indexed separately
      (function () {
          var link = document.createElement('link');
          link.rel = 'canonical';
          var slug = new URLSearchParams(window.location.search).get('slug');
          link.href = 'https://rahulkrishnan.me/project.html' + (slug ? '?slug=' + encodeURIComponent(slug) : '');
          document.head.appendChild(link);
      })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/minimal.css?v=20261018v4" />
</head>
<body>
  <div class="m-page">
    <div class="m-topbar">
      <a class="m-topbar__name m-mono" href="/">Rahul Krishnan</a>
      <nav class="m-tabs" aria-label="Site">
        <a class="m-tab" href="/#about">About</a>
        <a class="m-tab" href="/#recent">Recent</a>
        <a class="m-tab" href="/#work" aria-selected="true">Work</a>
      </nav>
      <button id="theme-toggle" type="button" class="m-topbar__theme m-mono" aria-label="Toggle light/dark theme">Theme</button>
    </div>

    <main id="content">
      <header class="m-header">
        <a class="m-back m-mono" id="back-link" href="/#projects">&larr; Projects</a>
        <h1 class="m-header__title" id="project-title"></h1>
        <p class="m-header__tagline" id="project-summary"></p>
      </header>
      <div class="m-panel m-detail" id="project-body"></div>
    </main>

    <footer class="m-footer m-mono">
      <span>Rahul Krishnan</span>
      <div class="m-footer__links">
        <a href="https://github.com/rahulk98">GitHub</a>
        <a href="mailto:rahulkrishnan1105@gmail.com">Email</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <script src="assets/js/subpage.js" defer></script>
  <script>
  (function(){
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const title = document.getElementById('project-title');
    const summary = document.getElementById('project-summary');
    const body = document.getElementById('project-body');
    const notFound = (text) => { title.textContent = text; };

    const params = new URLSearchParams(location.search);
    const slug = params.get('slug') || params.get('id');
    if (!slug) { notFound('Project not found'); return; }

    fetch('assets/data/projects.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(projects => {
        const project = projects.find(p => p.slug === slug);
        if (!project) {
          document.title = 'Project not found - Rahul Krishnan';
          notFound('Project not found');
          return;
        }
        document.title = `${project.title} - Rahul Krishnan`;

        if ((project.keywords || []).includes('Research')) {
          const back = document.getElementById('back-link');
          back.href = '/#research';
          back.innerHTML = '&larr; Research';
        }
        title.textContent = project.title;
        summary.textContent = project.summary || '';

        const tags = (project.tags && project.tags.length) ? project.tags : (project.stack || []);
        const paras = (project.detail || []).filter(Boolean);
        const links = Object.entries(project.links || {});
        body.innerHTML = `
          ${project.outcome ? `<div class="m-paper__result"><span class="m-paper__result-label m-mono">Result</span><p class="m-paper__result-text">${esc(project.outcome)}</p></div>` : ''}
          ${paras.length ? `<div class="m-prose">${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>` : ''}
          ${tags.length ? `<div class="m-project__stack m-mono">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
          ${links.length ? `<div class="m-paper__links m-mono">${links.map(([k, v]) =>
            `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k === 'github' ? 'GitHub' : k.charAt(0).toUpperCase() + k.slice(1))}</a>`).join('')}</div>` : ''}
        `;
      })
      .catch(() => notFound('Failed to load project'));
  })();
  </script>
</body>
</html>
