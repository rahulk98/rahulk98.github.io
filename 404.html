<!doctype html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2C109RKXQE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2C109RKXQE');
    </script>
    <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <script>
      (function () {
          try {
              var saved = localStorage.getItem('theme');
              var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              var theme = saved || (prefersDark ? 'dark' : 'light');
              var root = document.documentElement;
              root.classList.remove('light', 'dark');
              root.classList.add(theme === 'light' ? 'light' : 'dark');
          } catch (e) {}
      })();
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <main>
    <section class="not-found">
      <div class="icon" aria-hidden="true" id="error-icon"></div>
      <h1 id="error-title">404</h1>
      <p id="error-message">Sorry, that page doesn't exist.</p>
      <p><a class="btn" href="/" id="error-action">Go home</a></p>
    </section>
  </main>
</body>
</html>
